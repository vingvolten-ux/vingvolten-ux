<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#05070a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <radialGradient id="ghostBody" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#eafff5" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#7CFFCB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="smoke1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="smoke2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00fff7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00fff7" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurHeavy" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="glowText" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowTextSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes drift1 { 0% { transform: translate(0,0); } 50% { transform: translate(25px,-15px); } 100% { transform: translate(0,0); } }
      @keyframes drift2 { 0% { transform: translate(0,0); } 50% { transform: translate(-30px,10px); } 100% { transform: translate(0,0); } }
      @keyframes flicker { 0%,100% { opacity: 1; } 45% { opacity: 0.8; } 50% { opacity: 0.4; } 55% { opacity: 0.85; } }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .smokeA { animation: drift1 7s ease-in-out infinite; }
      .smokeB { animation: drift2 9s ease-in-out infinite; }
      .ghost { animation: floaty 4s ease-in-out infinite; }
      .flicker { animation: flicker 3.2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- smoke wisps -->
  <ellipse class="smokeA" cx="220" cy="90" rx="180" ry="90" fill="url(#smoke1)" filter="url(#blurHeavy)"/>
  <ellipse class="smokeB" cx="980" cy="230" rx="220" ry="100" fill="url(#smoke2)" filter="url(#blurHeavy)"/>
  <ellipse class="smokeA" cx="600" cy="260" rx="260" ry="70" fill="url(#smoke1)" filter="url(#blurHeavy)" opacity="0.6"/>

  <!-- faint matrix-style code rain columns -->
  <g fill="#1c3d2a" font-family="Consolas, monospace" font-size="13" opacity="0.55">
    <text x="40" y="40">01 10 11 00</text>
    <text x="40" y="60">sudo access --grant</text>
    <text x="40" y="80">[ok] shell spawned</text>
    <text x="1000" y="40">0xFF 0x39 0xA1</text>
    <text x="1000" y="60">tracing route...</text>
    <text x="1000" y="80">[ok] identity: cloaked</text>
    <text x="60" y="270">> compiling legend.exe</text>
    <text x="880" y="290">> status: building</text>
  </g>

  <!-- ghost silhouette -->
  <g class="ghost">
    <ellipse cx="600" cy="150" rx="150" ry="150" fill="url(#ghostBody)" filter="url(#blurSoft)"/>
    <path d="M 480 150 
             C 480 60, 720 60, 720 150
             L 720 240
             L 690 215
             L 660 240
             L 630 215
             L 600 240
             L 570 215
             L 540 240
             L 510 215
             L 480 240 Z"
          fill="#0d1117" stroke="#39FF14" stroke-width="2.5" filter="url(#glowTextSoft)" opacity="0.9"/>
    <ellipse cx="565" cy="145" rx="12" ry="16" fill="#39FF14" filter="url(#glowText)"/>
    <ellipse cx="635" cy="145" rx="12" ry="16" fill="#39FF14" filter="url(#glowText)"/>
  </g>

  <!-- main title -->
  <text x="600" y="285" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="46" font-weight="bold" fill="#39FF14" filter="url(#glowText)" class="flicker"
        letter-spacing="6">REPH193</text>

  <text x="600" y="305" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="14" fill="#7CFFCB" letter-spacing="4" opacity="0.85">
    STATUS: BUILDING IN THE DARK // NOT KNOWN YET
  </text>
</svg>
